<svg xmlns="http://www.w3.org/2000/svg" width="300" height="169" viewBox="0 0 300 169" role="img" aria-label="Unknown map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181818"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.10"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="glow" cx="0.45" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 60% black textured base -->
  <rect width="300" height="169" fill="url(#bg)"/>
  <rect width="300" height="169" fill="url(#glow)"/>
  <rect width="300" height="169" filter="url(#noise)"/>

  <!-- red map viewport frame -->
  <rect x="36" y="30" width="228" height="109" rx="6"
        fill="none" stroke="#ef4444" stroke-width="2.5" stroke-opacity="0.9"/>

  <!-- 30% red: terrain contour lines (top-down minimap) -->
  <g fill="none" stroke="#ef4444" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer contour -->
    <path d="M78 72 C96 52 138 48 168 56 C200 64 220 78 214 98 C208 118 176 126 146 121 C112 116 60 96 78 72 Z"
          stroke-opacity="0.18" stroke-width="2"/>
    <!-- mid contour -->
    <path d="M96 78 C112 64 146 62 168 68 C192 75 206 86 200 100 C194 114 168 118 146 114 C120 110 82 92 96 78 Z"
          stroke-opacity="0.35" stroke-width="2"/>
    <!-- inner contour -->
    <path d="M112 84 C124 74 150 72 166 77 C184 82 192 90 188 100 C184 110 166 112 150 109 C132 106 102 94 112 84 Z"
          stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <!-- 10% gold: objective waypoint marker -->
  <g>
    <circle cx="164" cy="96" r="14" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="164" cy="96" r="5" fill="#fbbf24"/>
    <circle cx="164" cy="96" r="2" fill="#0a0a0a"/>
  </g>
</svg>
