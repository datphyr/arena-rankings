{% extends "base.html" %}
{% block title %}Head-to-Head — Arena Rankings{% endblock %}
{% block content %}
<div class="section-head"><h2>Head-to-Head</h2>
<form class="filters section-filters" method="get" action="/h2h" id="h2hForm">
  <select name="game">
    <option value="">All games</option>
    {% for g in games %}
    <option value="{{ g }}" {{ 'selected' if game == g }}>{{ g }}</option>
    {% endfor %}
  </select>
  <input type="text" name="p1" value="{{ p1 }}" placeholder="Player 1" data-autocomplete="player">
  <input type="hidden" name="p1_id" value="{{ p1_id or '' }}">
  <button type="button" class="btn swap-btn" id="swapBtn" title="Swap players" aria-label="Swap players">⇄</button>
  <input type="text" name="p2" value="{{ p2 }}" placeholder="Player 2" data-autocomplete="player">
  <input type="hidden" name="p2_id" value="{{ p2_id or '' }}">
  <button type="submit" name="clear" value="1" class="btn">Clear filters</button>
</form>
</div>

{% include "_h2h_results.html" %}

<script>
// Rewrite the h2h form action to the readable slug URL on submit, so the
// address bar shows /h2h/{p1}-vs-{p2}?... (ids authoritative).
// Runs before ajax-filters.js's submit handler (registered earlier), which
// reads form.getAttribute('action') at submit time and appends the full form
// query (p1/p1_id/p2/p2_id/game). We set only the slug path here; the ids
// come from the form's hidden p1_id/p2_id inputs, which the route reads.
(function () {
  var form = document.querySelector('form.filters[action="/h2h"]');
  if (!form) return;
  form.addEventListener("submit", function () {
    var p1 = form.querySelector('input[name="p1"]');
    var p2 = form.querySelector('input[name="p2"]');
    if (!p1 || !p2 || !p1.value || !p2.value) return;
    var slug = (p1.value + "-vs-" + p2.value)
      .toLowerCase().replace(/[^\w\- ]/g, "").replace(/[\s_]+/g, "-");
    form.setAttribute("action", "/h2h/" + slug);
    // Drop the redundant p1/p2 name params from the submitted query — the
    // ids (p1_id/p2_id) are authoritative, so the names are unnecessary.
    // Disable only for the duration of this submit so the fields stay
    // editable afterward (FormData reads them synchronously, then we
    // re-enable on the next tick). Permanently disabling would lock the
    // fields once both players are filled.
    p1.disabled = true;
    p2.disabled = true;
    setTimeout(function () {
      p1.disabled = false;
      p2.disabled = false;
    }, 0);
  });
})();

// Swap players: exchange the p1/p2 (and p1_id/p2_id) inputs, then navigate to
// the swapped URL. A full navigation (not the AJAX results swap) is used so
// the map chart and everything else re-renders for the new player 1.
(function () {
  var swapBtn = document.getElementById('swapBtn');
  var form = document.getElementById('h2hForm');
  if (!swapBtn || !form) return;
  swapBtn.addEventListener('click', function () {
    var p1 = form.querySelector('input[name="p1"]');
    var p2 = form.querySelector('input[name="p2"]');
    var p1id = form.querySelector('input[name="p1_id"]');
    var p2id = form.querySelector('input[name="p2_id"]');
    if (!p1 || !p2) return;
    var t = p1.value; p1.value = p2.value; p2.value = t;
    if (p1id && p2id) { var ti = p1id.value; p1id.value = p2id.value; p2id.value = ti; }
    var game = form.querySelector('select[name="game"]');
    var params = [];
    if (p1.value) params.push('p1=' + encodeURIComponent(p1.value));
    if (p2.value) params.push('p2=' + encodeURIComponent(p2.value));
    if (p1id && p1id.value) params.push('p1_id=' + encodeURIComponent(p1id.value));
    if (p2id && p2id.value) params.push('p2_id=' + encodeURIComponent(p2id.value));
    if (game && game.value) params.push('game=' + encodeURIComponent(game.value));
    window.location.href = '/h2h' + (params.length ? '?' + params.join('&') : '');
  });
})();

// Map win-rate chart (player 1 vs player 2): diverging bars centered at 50%.
// Bars grow UP (green) from 50% when WR > 50%, grow DOWN (red) from 50%
// when WR < 50%. Bar length = |WR - 50%|. Data is read from the canvas's
// data-edges attribute (server-rendered, respects the global game filter), so
// the same builder works on first load and after an AJAX swap (the new canvas
// carries fresh data). Exposed globally so ajax-filters.js can rebuild it.
window.buildH2hMapEdgeChart = function () {
  var el = document.getElementById('h2hMapEdgeChart');
  if (!el || !el.dataset || !el.dataset.edges) return;
  var mapEdges;
  try { mapEdges = JSON.parse(el.dataset.edges); } catch (e) { return; }
  if (!mapEdges.maps || !mapEdges.maps.length) return;

  function cssVar(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }
  function lerpColor(a, b, t) {
    var pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
    var pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
    var c = pa.map(function (p, i) { return Math.round(p + (pb[i] - p) * t); });
    return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  }
  var gameIconClass = {
    'Blood Run': ['pfcat-br', '\ue609'], 'Diabotical': ['pfcat-db', '\ue600'], 'Quake 2': ['pfcat-q2', '\ue608'],
    'Quake 3 Arena': ['pfcat-q3a', '\ue609'], 'Quake 3 CPMA': ['pfcat-cpma', '\ue900'], 'Quake 4': ['pfcat-q4', '\ue60a'],
    'Quake Champions': ['pfcat-qc', '\ue901'], 'Quake Live': ['pfcat-ql', '\ue60b'], 'Quake World': ['pfcat-q1', '\ue607'],
    'Reflex': ['pfcat-rflx', '\ue60c'], 'Unreal Tournament': ['pfcat-ut', '\ue60d'], 'Xonotic': ['pfcat-xon', '\ue60f'],
  };

  var labels = mapEdges.maps.map(function (m) { return m.name; });
  var data = mapEdges.maps.map(function (m) { return (m.win_rate - 0.5) * 100; });
  var grid = cssVar('--border', 'rgba(128,128,128,0.2)');
  var text = cssVar('--text-dim', '#888');
  var baseGreen = cssVar('--green', '#10b981');
  var baseRed = cssVar('--red', '#ef4444');
  var baseYellow = cssVar('--yellow', '#eab308');
  function barColor(wr) {
    if (wr <= 0.5) return lerpColor(baseRed, baseYellow, wr / 0.5);
    return lerpColor(baseYellow, baseGreen, (wr - 0.5) / 0.5);
  }
  function toRgba(rgb, a) {
    return rgb.replace('rgb(', 'rgba(').replace(')', ', ' + a + ')');
  }
  var barBgPlugin = {
    id: 'barBg',
    beforeDatasetsDraw: function (chart) {
      var area = chart.chartArea;
      if (!area) return;
      var yScale = chart.scales.y;
      var meta = chart.getDatasetMeta(0);
      var ctx = chart.ctx;
      ctx.save();
      var y0 = yScale.getPixelForValue(0);
      var yBottom = yScale.getPixelForValue(-50);
      for (var i = 0; i < meta.data.length; i++) {
        var b = meta.data[i];
        if (!b || b.hidden) continue;
        var wr = mapEdges.maps[i].win_rate;
        var x = b.x - b.width / 2;
        ctx.fillStyle = toRgba(barColor(wr), 0.18);
        ctx.fillRect(x, y0, b.width, yBottom - y0);
      }
      ctx.restore();
    }
  };
  if (window.__h2hMapEdgeChart) window.__h2hMapEdgeChart.destroy();
  window.__h2hMapEdgeChart = new Chart(el, {
    type: 'bar',
    plugins: [barBgPlugin],
    data: {
      labels: labels,
      datasets: [{
        label: 'win rate vs 50%',
        data: data,
        backgroundColor: function (c) { return barColor(mapEdges.maps[c.dataIndex].win_rate); },
        borderWidth: 0,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          intersect: false,
          mode: 'index',
          caretSize: 0,
          caretPadding: 0,
          backgroundColor: 'transparent',
          borderColor: 'transparent',
          callbacks: { title: function () { return ''; }, label: function () { return ''; } },
          external: function (ctx) {
            var tooltip = ctx.tooltip;
            var tip = document.getElementById('h2hMapEdgeTooltip');
            if (!tip) {
              tip = document.createElement('div');
              tip.id = 'h2hMapEdgeTooltip';
              tip.style.cssText = 'position:absolute;pointer-events:none;z-index:10;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:.8rem;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.5);transform:translate(-50%,10px);';
              el.parentElement.appendChild(tip);
            }
            if (!tooltip.opacity || !tooltip.dataPoints.length) { tip.style.opacity = 0; return; }
            var m = mapEdges.maps[tooltip.dataPoints[0].dataIndex];
            var icArr = gameIconClass[m.game] || null;
            var html = '';
            if (m.image) html += '<img src="https://www.plusforward.net' + m.image + '" style="width:auto;height:auto;display:block;margin:0 auto 6px;border-radius:8px">';
            html += '<div style="font-weight:700;white-space:nowrap;text-align:center">';
            if (icArr) html += '<i class="game-icon ' + icArr[0] + '" style="margin-right:4px;vertical-align:middle"></i>';
            html += m.name + '</div>';
            html += '<div style="margin-top:2px;text-align:center">' + (m.win_rate * 100).toFixed(0) + '% WR</div>';
            html += '<div style="opacity:.8;text-align:center">' + m.wins + 'W:' + m.losses + 'L</div>';
            tip.innerHTML = html;
            tip.style.opacity = 1;
            var area = ctx.chart.chartArea;
            tip.style.left = tooltip.caretX + 'px';
            tip.style.top = (area.bottom + 6) + 'px';
          }
        }
      },
      scales: {
        y: {
          min: -50, max: 50, border: { display: false }, grid: { color: grid },
          ticks: { color: text, font: { family: "'JetBrains Mono', monospace" }, callback: function (v) { return (v + 50) + '%'; } },
        },
        x: {
          position: 'top', grid: { display: false },
          ticks: { color: text, font: { family: "'JetBrains Mono', monospace", size: 11 }, maxRotation: 90, autoSkip: false },
        }
      }
    }
  });
};
window.buildH2hMapEdgeChart();
document.addEventListener('themechange', function () { window.buildH2hMapEdgeChart(); });
</script>
{% endblock %}
