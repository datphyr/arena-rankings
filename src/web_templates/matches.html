{% extends "base.html" %}
{% block title %}Matches — Arena Rankings{% endblock %}
{% block content %}
<div class="section-head"><h2>Recent Matches</h2></div>

<form class="filters" method="get" action="/matches">
  <label>Game</label>
  <select name="game">
    <option value="">All games</option>
    {% for g in games %}
    <option value="{{ g }}" {{ 'selected' if game == g }}>{{ g }}</option>
    {% endfor %}
  </select>
  <label>Player</label>
  <input type="text" name="player" value="{{ player }}" placeholder="Player name" style="width:140px" data-autocomplete="player">
  <label>Tournament</label>
  <input type="text" name="tournament" value="{{ tournament }}" placeholder="Tournament name" style="width:160px" data-autocomplete="tournament">
  <label>Limit</label>
  <select name="limit">
    <option value="100" {{ 'selected' if limit == '100' }}>100</option>
    <option value="1000" {{ 'selected' if limit == '1000' }}>1000</option>
    <option value="all" {{ 'selected' if limit == 'all' }}>All</option>
  </select>
  <button type="submit">Apply</button>
  <button type="submit" name="clear" value="1" class="btn-clear">Clear filters</button>
</form>

{% include "_matches_results.html" %}
{% endblock %}
